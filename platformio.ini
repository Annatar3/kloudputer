; Kloudputer: an unofficial pocket client for Claude on the M5Stack Cardputer ADV
; ESP32-S3FN8, 8 MB flash, no PSRAM. Arduino 3.x via pioarduino.
[env:cardputer-adv]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.312-1/platform-espressif32.zip
board = esp32-s3-devkitc-1
framework = arduino

board_upload.flash_size = 8MB
board_build.flash_mode = dio
board_build.partitions = partitions.csv

monitor_speed = 115200
upload_speed = 1500000
upload_port = /dev/ttyACM0
monitor_port = /dev/ttyACM0

build_flags =
    -DCORE_DEBUG_LEVEL=3
    -DARDUINO_USB_CDC_ON_BOOT=1   ; Serial over the native USB-JTAG CDC (/dev/ttyACM0)
    -DARDUINO_USB_MODE=1

; Pinned, so release builds are reproducible: the exact versions every release so far was tested with.
; Order matters: each library's own "any version" / ">=" dependencies reuse what is already listed above it
; instead of pulling the newest (untested) release. M5GFX before M5Unified, both before M5Cardputer.
lib_deps =
    m5stack/M5GFX@0.2.36
    m5stack/M5Unified@0.2.29
    arduino-irremote/IRremote@4.7.1
    https://github.com/m5stack/M5Cardputer.git#bf64d3178ab43928fa02365fbe3937cec99716ad  ; ADV TCA8418 keyboard support
    bblanchon/ArduinoJson@7.4.3
