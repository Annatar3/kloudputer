# Builds the firmware on every push and pull request. A tag equal to kVersion in src/main.cpp (e.g. v1.7)
# also publishes a GitHub release with:
#   kloudputer-<tag>.bin      full image: flash at 0x0 (M5Burner, esptool) or install from M5Launcher
#   kloudputer-<tag>-app.bin  app only, for OTA-style installers
#   SHA256SUMS.txt
name: Firmware

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: firmware-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Cache PlatformIO
        uses: actions/cache@v4
        with:
          path: |
            ~/.platformio
            ~/.cache/pip
          key: pio-${{ runner.os }}-${{ hashFiles('platformio.ini') }}

      - name: Install PlatformIO
        run: pip install platformio==6.2.0

      - name: Build
        run: pio run -e cardputer-adv

      - name: Package
        run: |
          TAG="${GITHUB_REF_NAME}"
          if [[ "$GITHUB_REF" != refs/tags/* ]]; then
            TAG=$(grep -oP 'kVersion = "\K[^"]+' src/main.cpp)
          fi
          tools/package_release.sh "$TAG" dist

      - uses: actions/upload-artifact@v4
        with:
          name: kloudputer-firmware
          path: dist/
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kloudputer-firmware
          path: dist

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "Kloudputer $GITHUB_REF_NAME" \
            --generate-notes \
            --verify-tag
